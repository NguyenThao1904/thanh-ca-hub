# Alembic configuration, for creating new migrations:
#   uv run alembic revision --autogenerate -m "add lyrics column"
# The database URL comes from the app settings (DATABASE_URL or the SQLite default).
# Migrations are applied by the server at start-up, or with `uv run thanhca migrate`.

[alembic]
script_location = %(here)s/thanhca/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
