[project]
name = "thanhca"
version = "1.0.0"
description = "Thánh Ca Hub API: the song library of a choir's physical sheet-music binders."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.18",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.2",
    "boto3>=1.35",
    # Time zone data for Windows, which has no system time zone database.
    "tzdata>=2024.2",
]

[project.scripts]
thanhca = "thanhca.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "moto[s3]>=5.0",
    "ruff>=0.8",
    "httpx2>=2.13.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["thanhca"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:thanhca.*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = [
    "B008",   # FastAPI uses calls in parameter defaults (Depends, Query)
    "RUF001", # Vietnamese text contains characters ruff thinks are ambiguous
    "RUF002",
    "RUF003",
    "RUF012", # SQLAlchemy declarative class attributes (__table_args__, type_annotation_map)
]

[tool.ruff.lint.isort]
known-first-party = ["thanhca"]
known-local-folder = ["helpers"]
